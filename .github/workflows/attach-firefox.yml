name: Attach signed Firefox build

# Listed versions are signed only after Mozilla's review. This checks AMO every
# 6 hours and, once a release's version is approved, attaches that signed .xpi
# (the same file AMO serves) to the GitHub release.
#   gh workflow run attach-firefox.yml
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  attach:
    runs-on: ubuntu-latest
    env:
      AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
      AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - name: Attach approved builds to releases that lack one
        run: |
          mkdir -p out
          for tag in $(gh release list --limit 5 --json tagName -q '.[].tagName'); do
            if gh release view "$tag" --json assets -q '.assets[].name' | grep -q 'firefox-signed\.xpi$'; then
              echo "$tag: already has a signed .xpi"; continue
            fi
            version="${tag#v}"
            if python3 scripts/amo.py download "$version" out; then
              gh release upload "$tag" "out/windowed-video-fullscreen-$version-firefox-signed.xpi" --clobber
            fi
          done
