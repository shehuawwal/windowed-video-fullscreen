name: Submit Firefox build

# Submits an already-released version to addons.mozilla.org without a new tag.
#   gh workflow run sign-firefox.yml -f tag=v2.1.0                     # public listing (review)
#   gh workflow run sign-firefox.yml -f tag=v2.1.0 -f channel=unlisted # signed .xpi (as 2.1.0.1), attached to the release
# AMO accepts each version number once, across both channels.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to sign (e.g. v2.0.0)
        required: true
      channel:
        description: listed (public, reviewed) or unlisted (self-distributed .xpi)
        default: listed
        type: choice
        options: [listed, unlisted]

permissions:
  contents: write

jobs:
  sign:
    runs-on: ubuntu-latest
    env:
      AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
      AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
      AMO_CHANNEL: ${{ inputs.channel }}
      AMO_VERSION_SUFFIX: ${{ inputs.channel == 'unlisted' && '.1' || '' }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: ./scripts/build.sh
      - run: scripts/sign-firefox.sh
      - name: Attach signed .xpi to the release (unlisted only)
        if: inputs.channel == 'unlisted'
        run: gh release upload "${{ inputs.tag }}" dist/*-firefox-signed.xpi --clobber
