name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check
        run: for f in src/*.js src/*/*.js; do node --check "$f"; done
      - name: Unit tests
        run: node --test tests/
      - name: Behaviour tests (headless Chrome)
        run: tests/run-harness.sh "$(which google-chrome || which chromium)"
      - name: Build
        run: ./scripts/build.sh
      - name: Lint Firefox build
        run: npx --yes web-ext@8 lint --source-dir dist/firefox --self-hosted
      - uses: actions/upload-artifact@v4
        with:
          name: extension-builds
          path: dist/*.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Check tag matches manifest version
        run: test "v$(jq -r .version manifests/chrome.json)" = "$GITHUB_REF_NAME"
      - run: ./scripts/build.sh
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.zip --title "$GITHUB_REF_NAME" --notes "See CHANGELOG.md. Firefox zip is unsigned: load it from about:debugging, or sign it on addons.mozilla.org."
