name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Syntax check
        run: for f in src/*.js src/*/*.js; do node --check "$f"; done
      - name: Unit tests
        run: node --test tests/*.test.mjs
      - name: Behaviour tests (headless Chrome)
        run: tests/run-harness.sh "$(which google-chrome || which chromium)"
      - name: Build
        run: ./scripts/build.sh
      - name: Lint Firefox build
        run: npx --yes web-ext@8 lint --source-dir dist/firefox --self-hosted
      - uses: actions/upload-artifact@v7
        with:
          name: extension-builds
          path: dist/*.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
      AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Check tag matches manifest version
        run: test "v$(jq -r .version manifests/chrome.json)" = "$GITHUB_REF_NAME"
      - run: ./scripts/build.sh
      - name: Submit to addons.mozilla.org (public listing, only if AMO secrets are set)
        if: env.AMO_JWT_ISSUER != '' && env.AMO_JWT_SECRET != ''
        continue-on-error: true
        run: scripts/sign-firefox.sh
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          signed=(dist/*-firefox-signed.xpi)
          FF="**Firefox:** install from [addons.mozilla.org](https://addons.mozilla.org/firefox/addon/windowed-video-fullscreen/) (new versions appear there after Mozilla's review, and update automatically)."
          cat > notes.md <<NOTES
          **Chrome, Edge, Brave, Opera, Vivaldi:** unzip the Chrome zip, open \`chrome://extensions\`, turn on Developer mode, click Load unpacked and pick the folder.

          ${FF}

          Changes: see [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/CHANGELOG.md).
          NOTES
          gh release create "$GITHUB_REF_NAME" dist/*.zip "${signed[@]}" --title "$GITHUB_REF_NAME" --notes-file notes.md
